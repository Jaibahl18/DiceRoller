<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Random "N" Dice Roller</h1>
    </div>
    <div class="container">
        <label for="numDice">Enter number of die : </label>
        <input type="number" id="numDice" min="1" value="1">
        <button id="rollDice">Roll</button>
        <p id="diceValues"></p>
        <div id="diceImages">
            <img src="diceImages/1.png" alt="">
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
